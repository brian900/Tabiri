name: Tabiri — Daily Digest & LinkedIn

on:
  schedule:
    - cron: "0 7 * * *"    # Every day at 07:00 UTC → email digest + LinkedIn post
    - cron: "0 6 1 * *"    # Every 1st of month → refresh LinkedIn token

  workflow_dispatch:
    inputs:
      run_type:
        description: "What to run"
        required: true
        default: "digest"
        type: choice
        options:
          - digest
          - linkedin
          - refresh-token
          - all

jobs:
  email-digest:
    name: Send Daily Email Digest
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') ||
      (github.event_name == 'workflow_dispatch' && (
        github.event.inputs.run_type == 'digest' ||
        github.event.inputs.run_type == 'all'
      ))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Send digest to brianmasakari@gmail.com
        run: node server/digest.js
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Upload predictions artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabiri-predictions
          path: .tabiri/top-picks.json
          if-no-files-found: warn

  linkedin-post:
    name: Post to LinkedIn
    runs-on: ubuntu-latest
    needs: email-digest
    if: |
      always() && (
        (github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') ||
        (github.event_name == 'workflow_dispatch' && (
          github.event.inputs.run_type == 'linkedin' ||
          github.event.inputs.run_type == 'all'
        ))
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Download predictions artifact
        if: ${{ needs.email-digest.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: tabiri-predictions
          path: .tabiri

      - name: Post daily top 5 to LinkedIn
        run: node server/linkedin-post.js
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_ARTICLE_URL: ${{ secrets.LINKEDIN_ARTICLE_URL }}

  refresh-token:
    name: Refresh LinkedIn Token
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 1 * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_type == 'refresh-token')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Refresh LinkedIn OAuth token
        run: node server/refresh-token.js
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
